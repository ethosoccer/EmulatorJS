<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png" crossorigin="use-credentials">
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="stylesheet" href="css/index.css?v=20260419-console-filter">
    <script src="js/vendor/jquery.min.js"></script>
    <script src="js/vendor/hammer.min.js"></script>
    <script src="js/vendor/browserfs.min.js"></script>
    <script src="js/vendor/jszip.min.js"></script>
    <script src="js/index.js?v=20260419-console-filter"></script>
  </head>
  <body>
    <div id="menu">
      <div class="menu-toolbar">
        <a id="file-browser-link" class="icon-tool hidden" target="_blank" href="filebrowser.html">
          <img class="file-button" src="css/folder.svg"/>
        </a>
        <button class="icon-tool" type="button" onclick="fullscreen()" aria-label="Fullscreen">
          <img class="full-main" src="css/fullscreen.svg"/>
        </button>
        <button id="search-button" class="menu-tool menu-search" type="button" onclick="openSearchPanel()">Search</button>
        <button id="favorites-button" class="menu-tool menu-favorites" type="button" onclick="showFavorites()">Favorites</button>
        <button id="login-button" class="menu-tool menu-login" type="button" onclick="openLoginPanel()">Login</button>
      </div>
      <div id="search-panel" class="search-panel hidden">
        <div class="search-header">
          <h2>Find Games</h2>
          <button type="button" onclick="closeSearchPanel()">Close</button>
        </div>
        <input id="game-search" type="search" placeholder="Search games" autocomplete="off">
        <div class="search-actions">
          <button type="button" onclick="runGameSearch()">Search</button>
          <button type="button" onclick="clearGameSearch()">Clear</button>
        </div>
        <button id="advanced-search-toggle" type="button" onclick="toggleAdvancedSearch()">Advanced filters</button>
        <div id="advanced-search" class="advanced-search hidden">
          <label for="console-filter">Console</label>
          <select id="console-filter"></select>
          <label for="art-filter">Artwork</label>
          <select id="art-filter">
            <option value="all">Any artwork status</option>
            <option value="has-logo">Has logo art</option>
            <option value="missing-logo">Missing logo art</option>
            <option value="has-video">Has preview video</option>
            <option value="missing-video">Missing preview video</option>
          </select>
          <label class="checkbox-filter">
            <input id="favorites-filter" type="checkbox">
            Favorites only
          </label>
        </div>
        <div id="search-status" class="search-status">Type a title or open favorites.</div>
        <div id="search-results" class="search-results"></div>
      </div>
      <div id="favorites-panel" class="favorites-panel hidden">
        <div class="search-header">
          <h2>Favorites</h2>
          <button type="button" onclick="closeFavoritesPanel()">Close</button>
        </div>
        <div id="favorites-status" class="search-status">Loading favorites...</div>
        <div id="favorites-results" class="search-results"></div>
      </div>
      <div id="login-panel" class="login-panel hidden">
        <div class="search-header">
          <h2>Profile</h2>
          <button type="button" onclick="closeLoginPanel()">Close</button>
        </div>
        <div id="profile-logged-out">
          <input id="profile-user" type="text" placeholder="user" autocomplete="username">
          <input id="profile-pass" type="password" placeholder="pass" autocomplete="current-password">
          <div class="search-actions">
            <button type="button" onclick="profileLogin()">Login</button>
          </div>
        </div>
        <div id="profile-logged-in" class="hidden">
          <p id="profile-name"></p>
          <div class="search-actions">
            <button type="button" onclick="pullServerProfile()">Pull from Server</button>
            <button type="button" onclick="pushServerProfile()">Push to Server</button>
            <button type="button" onclick="profileLogout()">Logout</button>
          </div>
        </div>
        <div id="profile-status" class="search-status"></div>
      </div>
      <video autoplay muted loop id="bgvid">
        <source id="vid" type="video/mp4">
      </video>
      <img id="background" class="background">
      <img id="corner" class="corner">
      <div class="page-container">
        <div id="console-list-tools" class="console-list-tools hidden">
          <input id="console-list-search" type="search" placeholder="Filter this console" autocomplete="off" aria-label="Filter games in this console">
          <button id="console-list-clear" type="button" onclick="clearConsoleListFilter()">Clear</button>
          <span id="console-list-status"></span>
        </div>
        <div id="active-list" class="games-list"></div>
        <div class="artwork"></div>
      </div>
      <div id="games-list" class="hidden"></div>
    </div>
  </body>
</html>
